name: Deploy Sphinx Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    needs: checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pages_build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)
          if [ "$pages_build_type" != workflow ]; then
            echo '::error::Set Settings > Pages > Source to GitHub Actions before deploying.'
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install publishing dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
          python -m pip install -c docs/requirements.txt ".[docs]"
      - name: Build and verify artifact
        run: |
          python -m sphinx -E -a -W --keep-going -d "$RUNNER_TEMP/beanim-doctrees" -b html docs "$RUNNER_TEMP/beanim-pages"
          python scripts/prepare_docs.py "$RUNNER_TEMP/beanim-pages" --sha "$GITHUB_SHA"
          python scripts/verify_docs.py --artifact "$RUNNER_TEMP/beanim-pages" --sha "$GITHUB_SHA"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/beanim-pages

  deploy:
    needs: build
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live release
        timeout-minutes: 3
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_docs.py --url "$PAGE_URL" --sha "$GITHUB_SHA"
