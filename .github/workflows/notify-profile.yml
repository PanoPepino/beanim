name: Notify portfolio profile

on:
  push:
    paths:
      - README_FOR_WEBPAGE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request profile synchronisation
        env:
          GH_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'Configure PROFILE_SYNC_TOKEN: fine-grained token for PanoPepino/PanoPepino with Contents write.' >&2
            exit 1
          fi
          gh api --method POST repos/PanoPepino/PanoPepino/dispatches \
            -f event_type=projects-updated \
            -f "client_payload[source]=$SOURCE_REPOSITORY" \
            -f "client_payload[sha]=$SOURCE_SHA"
