[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[project]
authors = [{name = "PanoPepino", email = "panizofisico@gmail.com"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Operating System :: OS Independent",
]
dependencies = [
  "manim>=0.18",
  "numpy>=2.0.2",
  "pybtex>=0.23.0",
  "Pillow>=9.1",
  "pycairo>=1.13",
]
description = "Package to obtain a similar beamer-like experience while using manim and manim-slides"
readme = "README.md"
dynamic = ["version"]
keywords = ["manim", "slides", "presentations", "beamer"]
license = "MIT"
license-files = ["LICENSE*"]  # Glob pattern for license files
name = "manim_beanim"
requires-python = ">=3.11"

[project.optional-dependencies]
examples = ["manim-slides"]
dev = ["ruff", "build"]
docs = [
  "furo>= 2024.8.6",
  "sphinx>= 7.4.7",
]

[project.urls]
Documentation = "https://panopepino.github.io/beanim/"
Repository = "https://github.com/PanoPepino/beanim"

[tool.hatch.version]
path = "src/manim_beanim/__version__.py"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py", "docs/conf.py", "scripts/**/*.py"]
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_beanim"]

[dependency-groups]
dev = ["ruff", "build", "pre-commit>=3.5.0"]
